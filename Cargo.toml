[package]
name = "authenticationservices-rs"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/authenticationservices-rs"
repository = "https://github.com/doom-fish/authenticationservices-rs"
description = "Safe Rust bindings for Apple's AuthenticationServices framework — Apple ID, passwords, passkeys, credential identity store, settings helpers, and web auth on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["authentication", "passkey", "macos", "apple", "sign-in-with-apple"]
categories = ["api-bindings", "os::macos-apis"]
rust-version = "1.70"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
    "COVERAGE.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "authenticationservices"
crate-type = ["lib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[profile.release]
debug = "full"
strip = "none"
